name: Security

# Security scanning for student-support-frontend.
#
# Two scanners: Semgrep (SAST) and Trivy (dependency + misconfiguration).
# Reports saved as artifacts (if: always()):
#   semgrep-report   semgrep.json + semgrep.sarif   90 days
#   trivy-report     trivy.json   + trivy.sarif     90 days
#
# Triage process:
#   1. Download artifacts from CI run
#   2. Triage findings (Fix/Accept/Dismiss)
#   3. Add .trivyignore for accepted risks
#   4. Merge when no untriaged findings remain

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/owasp-top-ten p/security-audit
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep.sarif
          retention-days: 90

  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          exit-code: 0
          skip-dirs: .git,dist,build,.next,.nuxt

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          skip-dirs: .git,dist,build,.next,.nuxt

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Save Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-report
          path: |
            trivy.json
            trivy.sarif
          retention-days: 90
