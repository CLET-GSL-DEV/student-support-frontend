name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  # Manual escape hatch: build + push on demand (e.g. if a push event to dev
  # is dropped). Trigger from the Actions UI or `gh workflow run`.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Hoisted so the `if:` guards below can detect whether Sonar is configured.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube needs full history for accurate new-code detection.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level=high

  docker:
    name: Build and push image
    needs: [verify, security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    # Build, tag, push, scan and SBOM live in the org workflow (task 02/13), so how the
    # estate builds images is one commit there rather than ~45 near-identical ones.
    # Tags follow the branch: dev -> :dev, staging -> :staging, always plus the
    # immutable :<branch>-<sha>.
    uses: CLET-GSL-DEV/.github/.github/workflows/build-and-push.yml@main
    with:
      image_name: student-support-frontend
      # This repo already published :latest; kept so nothing that pulls it breaks.
      push_latest: true
      # Verbatim from this repo's own build-args. The caller resolves its own
      # vars, so the values stay visible here rather than depending on how
      # contexts resolve across a workflow call.
