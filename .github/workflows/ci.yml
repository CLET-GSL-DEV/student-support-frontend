name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  # Manual escape hatch: build + push on demand (e.g. if a push event to dev
  # is dropped). Trigger from the Actions UI or `gh workflow run`.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Hoisted so the `if:` guards below can detect whether Sonar is configured.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube needs full history for accurate new-code detection.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level=high

  docker:
    name: Build and push image
    needs: [verify, security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Deliberately NOT the org reusable workflow.
    #
    # This repository is PUBLIC; CLET-GSL-DEV/.github, which holds
    # build-and-push.yml, is private. A public repository cannot call a reusable
    # workflow from a private one — GitHub rejects the run before it creates a
    # single job, reporting only "this run likely failed because of a workflow file
    # issue" with no annotation. The file is valid; actionlint passes it. That is
    # what made this repo's CI red from the moment it adopted the shared workflow.
    #
    # Keep these steps in step with build-and-push.yml, or make this repo private
    # and switch back to the one-line call like every other frontend.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build args: every value the SPA needs is read from window.__CONFIG__ at
      # container start, so this image is the same artifact in every environment.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/clet-gsl-dev/student-support-frontend:${{ github.ref_name }}
            ghcr.io/clet-gsl-dev/student-support-frontend:${{ github.ref_name }}-${{ github.sha }}
            ghcr.io/clet-gsl-dev/student-support-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
