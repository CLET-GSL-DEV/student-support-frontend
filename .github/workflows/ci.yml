name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      packages: write
    uses: CLET-GSL-DEV/.github/.github/workflows/ci-node.yml@v1
    with:
      image_name: student-support-frontend
      app_images: |
        web=student-support-frontend
      # Sonar reports, it does not gate (as before).
      coverage_reports: |
        packages/utils/coverage/lcov.info
        packages/api-client/coverage/lcov.info
        apps/web/coverage/lcov.info
      sonar_project_key: CLET-GSL-DEV_student-support-frontend
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      sonar_host_url: ${{ secrets.SONAR_HOST_URL }}
