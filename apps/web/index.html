<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      __API_CSP_ORIGINS__ is replaced with the deduped bare origins of
      VITE_API_URL and VITE_IAM_URL (only those set to absolute URLs — the
      services may share a gateway or live on separate hosts) by the same
      Vite plugin — needed in connect-src since the app calls those backends
      directly when the URLs are absolute (no Vite dev-server proxy).
      Relative values are same-origin and contribute nothing.

      __ZITADEL_ORIGIN__ is the IdP origin, which must be allowed in connect-src
      (OIDC discovery / token / refresh) and frame-src (the monitorSession
      check-session iframe, and the login-UI redirect during silent renew).

      It is filled in exactly ONE of two ways, never both:
        - `vite dev` and a non-production build substitute VITE_ZITADEL_AUTHORITY
          (plus VITE_ZITADEL_LOGIN_UI_ORIGIN, where the interactive login UI is on
          a separate origin) at build time — see vite.config.ts;
        - a PRODUCTION build deliberately leaves the literal placeholder in
          dist/index.html, and docker/docker-entrypoint.sh substitutes the runtime
          ZITADEL_AUTHORITY at container start.

      The second half is not optional. Bake the origin and a runtime authority is
      blocked by a policy still naming the build-time one — and the symptom is
      "login does nothing", with no network error and nothing in the build to look at.

      __DEV_CSP_EXTRA__ is replaced with 'unsafe-eval' in `vite dev` only (never in
      a production build) — some dependency's dev-mode code path needs it. See
      vite.config.ts's `zitadelCsp` plugin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' __DEV_CSP_EXTRA__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_CSP_ORIGINS__ __ZITADEL_ORIGIN__; frame-src 'self' __ZITADEL_ORIGIN__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>GSL Student Support</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime configuration. Written by docker/docker-entrypoint.sh at CONTAINER
      START, never baked, and absent under `pnpm dev` (where import.meta.env is the
      source instead). It is a CLASSIC script and the bundle below is a module, which
      is deferred — so this always runs first and window.__CONFIG__ exists by the time
      any app module does. See src/config/runtimeConfig.ts.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
