# nginx config TEMPLATE for the GSL Student Support frontend.
#
# Rendered by docker/docker-entrypoint.sh with a RESTRICTED envsubst — only the variables
# that script names are substituted. nginx's own $uri / $host / $remote_addr / $proxy_host
# must survive into the rendered file, which is why the substitution is restricted rather
# than global.

server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # ── Uploads ────────────────────────────────────────────────────────────────
    # nginx defaults to 1m and silently 413s a larger POST. Stated as a variable so
    # raising it is a Deployment edit rather than a rebuild; the entrypoint defaults it
    # to 50m, which is what this location-scoped setting used to be.
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # ── DNS ────────────────────────────────────────────────────────────────────
    # A variable proxy_pass (see /api/ below) needs an explicit resolver, and the
    # container's own nameserver is the right one everywhere: kube-dns in the cluster,
    # 127.0.0.11 under Docker. The entrypoint reads it from /etc/resolv.conf rather than
    # writing a ClusterIP here, which would itself be a baked environment value.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    # ── Health ─────────────────────────────────────────────────────────────────
    # Points at the REAL entry bundle, written by the entrypoint at container start. A
    # probe on `/` is answered by the SPA fallback below for ANY path, so an image whose
    # JS never made it into dist/ still returns 200 and still reports Ready. This serves
    # that one file and 404s when it is missing.
    include /etc/nginx/clet/healthz.conf;

    # ── Runtime configuration ──────────────────────────────────────────────────
    # Generated per container, so it must never be cached — a pod restarted with
    # different configuration would otherwise serve the previous one.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # ── Same-origin API proxy to the System-17 gateway ─────────────────────────
    # The SPA calls /api/* same-origin (the gateway sends no CORS headers, so a
    # cross-origin call would fail). Host MUST be $proxy_host (the gateway service),
    # NOT $host (the site host): APISIX matches host-specific routes first, so
    # forwarding the site host makes the gateway match THIS site's own <host>/*
    # catch-all and bounce /api/* back here -> loop -> 502.
    #
    # The upstream goes through a VARIABLE, with the resolver set at server level above.
    # A literal hostname in proxy_pass is resolved by nginx ONCE, at startup, and a name
    # it cannot resolve is a fatal config error — nginx exits rather than starts. That
    # makes the image unrunnable anywhere the cluster DNS name does not exist (a laptop,
    # a CI smoke test), and in-cluster it turns a momentary DNS blip during a rollout
    # into a container that will not come up at all. Assigning to a variable defers
    # resolution to request time: nginx starts regardless, and an unresolvable upstream
    # degrades to a 502 on that request instead of taking the whole SPA down with it.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $proxy_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static asset caching ───────────────────────────────────────────────────
    # Vite fingerprints asset filenames, so they are safe to cache indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must NEVER be cached: it is what points at the current asset hashes, so
    # a cached copy pins a browser to a deployment that no longer exists — and it now
    # also carries the CSP the entrypoint rendered for THIS environment.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── SPA routing ────────────────────────────────────────────────────────────
    # All routes serve index.html so the client router handles navigation
    # (including /auth/callback and /auth/logout/callback for the OIDC flow).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
