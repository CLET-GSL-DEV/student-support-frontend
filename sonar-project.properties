# sonar.organization is MANDATORY on SonarCloud. Without it every scan dies with
# "You must define the following mandatory properties ...: sonar.organization",
# which fails the verify job and — now that docker gates on verify — would keep
# skipping the image build. servicedesk-frontend carries the same note; it hit this
# first. The key follows the org's <ORG>_<repo> form used by the other frontends.
sonar.projectKey=CLET-GSL-DEV_student-support-frontend
sonar.organization=clet-gsl-dev
sonar.projectName=student-support-frontend
sonar.sourceEncoding=UTF-8

# Analyze app + package source; test files are classified as tests below.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Keep generated / non-source files out of analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/*.config.ts,**/*.config.js,**/e2e/**,**/*.d.ts,**/vite-env.d.ts

# Merge per-workspace coverage into the quality gate.
sonar.javascript.lcov.reportPaths=packages/utils/coverage/lcov.info,packages/api-client/coverage/lcov.info,apps/web/coverage/lcov.info
